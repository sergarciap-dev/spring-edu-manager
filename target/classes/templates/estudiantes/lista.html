<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estudiantes - SpringEduManager</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <style>
      body {
        background-color: #f8f9fa;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        margin: 0;
        padding: 2.5rem 1rem;
      }
      .main-container {
        max-width: 960px;
        margin: 0 auto;
      }
      .header-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.75rem;
      }
      .table-card {
        background: #ffffff;
        border-radius: 10px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
        overflow: hidden;
      }
      .table {
        margin-bottom: 0;
      }
      .table th {
        background-color: #212529;
        color: #fff;
        border: none;
        padding: 0.85rem 1rem;
        font-weight: 600;
      }
      .table td {
        vertical-align: middle;
        padding: 0.85rem 1rem;
        border-color: #f1f3f5;
      }
      .btn-custom {
        display: inline-block;
        padding: 0.45rem 1rem;
        font-weight: 500;
        border-radius: 6px;
        text-decoration: none;
        font-size: 0.9rem;
      }
      .btn-blue {
        background-color: #0d6efd;
        color: #fff;
        border: none;
      }
      .btn-gray {
        background-color: #6c757d;
        color: #fff;
        border: none;
      }
      .btn-danger-custom {
        background-color: #dc3545;
        color: #fff;
        border: none;
        padding: 0.3rem 0.75rem;
        border-radius: 5px;
        font-size: 0.85rem;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="main-container">
      <div class="header-bar">
        <h2 style="font-weight: 700; color: #212529; margin: 0">
          Listado de Estudiantes
        </h2>
        <div style="display: flex; gap: 0.5rem">
          <a href="/" class="btn-custom btn-gray">Inicio</a>
          <a href="/estudiantes/nuevo" class="btn-custom btn-blue"
            >+ Nuevo Estudiante</a
          >
        </div>
      </div>

      <div class="table-card">
        <table class="table table-hover">
          <thead>
            <tr>
              <th style="width: 80px">ID</th>
              <th>Nombre</th>
              <th>Apellido</th>
              <th>Correo Electrónico</th>
              <th
                sec:authorize="hasRole('ADMIN')"
                style="text-align: center; width: 120px"
              >
                Acciones
              </th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="e : ${estudiantes}">
              <td th:text="${e.id}">1</td>
              <td th:text="${e.nombre}">Mariana</td>
              <td th:text="${e.apellido}">Silva</td>
              <td th:text="${e.email}">mariana.silva@example.com</td>
              <td sec:authorize="hasRole('ADMIN')" style="text-align: center">
                <a
                  th:href="@{/estudiantes/eliminar/{id}(id=${e.id})}"
                  class="btn-danger-custom"
                  onclick="
                    return confirm(
                      '¿Seguro que deseas eliminar este estudiante?',
                    );
                  "
                >
                  Eliminar
                </a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </body>
</html>
