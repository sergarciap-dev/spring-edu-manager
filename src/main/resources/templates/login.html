<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Login - SpringEduManager</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
  </head>
  <body class="bg-light d-flex align-items-center vh-100">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-4">
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <h3 class="card-title text-center mb-4">Iniciar Sesión</h3>
              <div th:if="${param.error}" class="alert alert-danger py-2">
                Credenciales inválidas.
              </div>
              <div th:if="${param.logout}" class="alert alert-info py-2">
                Sesión finalizada correctamente.
              </div>
              <form th:action="@{/login}" method="post">
                <div class="mb-3">
                  <label class="form-label">Usuario</label>
                  <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="admin o user"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label class="form-label">Contraseña</label>
                  <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="admin123 o user123"
                    required
                  />
                </div>
                <button type="submit" class="btn btn-primary w-100">
                  Entrar
                </button>
              </form>
              <div class="mt-3 text-muted small">
                <strong>Usuarios de prueba:</strong><br />
                • admin / admin123 (Crea cursos y gestiona)<br />
                • user / user123 (Solo lectura de cursos)
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
