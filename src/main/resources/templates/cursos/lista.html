<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cursos - SpringEduManager</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <style>
      body {
        background-color: #f8f9fa;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        margin: 0;
        padding: 2.5rem 1rem;
      }
      .main-container {
        max-width: 960px;
        margin: 0 auto;
      }
      .header-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.75rem;
      }
      .table-card {
        background: #ffffff;
        border-radius: 10px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
        overflow: hidden;
      }
      .table {
        margin-bottom: 0;
      }
      .table th {
        background-color: #212529;
        color: #fff;
        border: none;
        padding: 0.85rem 1rem;
        font-weight: 600;
      }
      .table td {
        vertical-align: middle;
        padding: 0.85rem 1rem;
        border-color: #f1f3f5;
      }
      .btn-custom {
        display: inline-block;
        padding: 0.45rem 1rem;
        font-weight: 500;
        border-radius: 6px;
        text-decoration: none;
        font-size: 0.9rem;
      }
      .btn-green {
        background-color: #198754;
        color: #fff;
        border: none;
      }
      .btn-gray {
        background-color: #6c757d;
        color: #fff;
        border: none;
      }
    </style>
  </head>
  <body>
    <div class="main-container">
      <div class="header-bar">
        <h2 style="font-weight: 700; color: #212529; margin: 0">
          Listado de Cursos
        </h2>
        <div style="display: flex; gap: 0.5rem">
          <a href="/" class="btn-custom btn-gray">Inicio</a>
          <a
            sec:authorize="hasRole('ADMIN')"
            href="/cursos/nuevo"
            class="btn-custom btn-green"
            >+ Nuevo Curso (Solo Admin)</a
          >
        </div>
      </div>

      <div class="table-card">
        <table class="table table-hover">
          <thead>
            <tr>
              <th style="width: 80px">ID</th>
              <th>Nombre</th>
              <th>Descripción</th>
              <th style="width: 120px; text-align: center">Horas</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="c : ${cursos}">
              <td th:text="${c.id}">1</td>
              <td th:text="${c.nombre}" style="font-weight: 600">
                Spring Framework &amp; Boot
              </td>
              <td th:text="${c.descripcion}">
                Desarrollo backend empresarial con JEE
              </td>
              <td
                th:text="${c.duracionHoras} + ' hrs'"
                style="text-align: center"
              >
                60 hrs
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </body>
</html>
