<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inicio - SpringEduManager</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <style>
      body {
        background-color: #f8f9fa;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        margin: 0;
      }
      .navbar-bg {
        background-color: #212529;
        padding: 0.85rem 0;
        color: #fff;
      }
      .navbar-container {
        max-width: 960px;
        margin: 0 auto;
        padding: 0 1rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .hero-card {
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
        padding: 3rem;
        margin-top: 3rem;
      }
      .btn-custom {
        display: inline-block;
        padding: 0.55rem 1.25rem;
        font-weight: 500;
        border-radius: 6px;
        text-decoration: none;
        border: 1px solid transparent;
      }
      .btn-blue {
        background-color: #0d6efd;
        color: #fff;
      }
      .btn-gray {
        background-color: #6c757d;
        color: #fff;
      }
      .btn-outline {
        border-color: #6c757d;
        color: #495057;
      }
    </style>
  </head>
  <body>
    <nav class="navbar-bg">
      <div class="navbar-container">
        <div style="font-weight: 700; font-size: 1.25rem">SpringEduManager</div>
        <div style="display: flex; align-items: center; gap: 1rem">
          <span
            sec:authorize="isAuthenticated()"
            style="
              display: flex;
              align-items: center;
              gap: 0.5rem;
              font-size: 0.95rem;
              color: #ced4da;
            "
          >
            Usuario:
            <strong style="color: #fff" sec:authentication="name"></strong>
            <span
              sec:authorize="hasRole('ADMIN')"
              style="
                background-color: #198754;
                color: #fff;
                font-size: 0.75rem;
                font-weight: 600;
                padding: 0.2rem 0.55rem;
                border-radius: 12px;
                text-transform: uppercase;
              "
              >Admin</span
            >
            <span
              sec:authorize="!hasRole('ADMIN')"
              style="
                background-color: #6c757d;
                color: #fff;
                font-size: 0.75rem;
                font-weight: 600;
                padding: 0.2rem 0.55rem;
                border-radius: 12px;
                text-transform: uppercase;
              "
              >User</span
            >
          </span>
          <form
            th:action="@{/logout}"
            method="post"
            sec:authorize="isAuthenticated()"
            style="margin: 0; display: inline"
          >
            <button type="submit" class="btn btn-outline-light btn-sm">
              Cerrar Sesión
            </button>
          </form>
          <a
            href="/login"
            class="btn btn-outline-light btn-sm"
            sec:authorize="!isAuthenticated()"
            >Ingresar</a
          >
        </div>
      </div>
    </nav>

    <div
      class="container"
      style="max-width: 960px; margin: 0 auto; padding: 0 1rem"
    >
      <div class="hero-card">
        <h1
          style="
            font-size: 2.25rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #212529;
          "
        >
          Plataforma Educativa SpringEduManager
        </h1>
        <p
          style="
            font-size: 1.15rem;
            color: #6c757d;
            line-height: 1.6;
            margin-bottom: 2rem;
          "
        >
          Módulo de gestión académica interna: administra estudiantes, cursos y
          consulta la interoperabilidad REST.
        </p>
        <div style="display: flex; gap: 0.75rem; flex-wrap: wrap">
          <a href="/cursos" class="btn-custom btn-blue">Ver Cursos</a>
          <a href="/estudiantes" class="btn-custom btn-gray">Ver Estudiantes</a>
          <a href="/h2-console" target="_blank" class="btn-custom btn-outline"
            >Consola H2</a
          >
        </div>
      </div>
    </div>
  </body>
</html>
